<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PulseFit — Bodyweight Progressions</title>
  <meta name="description" content="Master bodyweight training one progression at a time. Guided routines, exercise tutorials, level tracking, challenges and badges — free, in your browser." />
  <meta name="theme-color" content="#1c2a55" />
  <!-- Only this site's own scripts may run; network calls only to this site and Supabase. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />

  <!-- Installable app (PWA) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PulseFit" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- Apply saved theme before first paint -->
  <script src="theme-boot.js"></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <div class="shell">
    <nav class="sidebar" aria-label="Main">
      <a class="brand" href="#/today">
        <img class="brand-mark" src="icons/icon.svg" alt="" width="34" height="34" />
        PulseFit
      </a>
      <div data-nav></div>
      <p class="sidebar-foot">Progress is saved in this browser.</p>
    </nav>

    <main class="main" id="main" tabindex="-1">
      <div class="page" id="view" aria-live="polite"></div>
    </main>
  </div>

  <nav class="tabbar" aria-label="Main" data-nav></nav>

  <div id="layer"></div>

  <noscript>
    <p style="padding:24px;color:#fff">PulseFit needs JavaScript enabled to run.</p>
  </noscript>

  <script src="data.js"></script>
  <script src="img/manifest.js"></script>
  <script src="sync-config.js"></script>
  <script src="sync-core.js"></script>
  <script src="mealplan.js"></script>
  <script src="recipes.js"></script>
  <script src="pwa.js"></script>
  <script src="app.js"></script>
  <script src="sync.js"></script>
</body>
</html>
