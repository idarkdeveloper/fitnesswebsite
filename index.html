<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PulseFit — Bodyweight Progressions</title>
  <meta name="description" content="Master bodyweight training one progression at a time. Guided routines, exercise tutorials, level tracking, challenges and badges — free, in your browser." />
  <meta name="theme-color" content="#1c2a55" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />

  <!-- Apply saved theme before first paint -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('pf2_state') || '{}');
        var t = s.profile && s.profile.theme;
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <div class="shell">
    <nav class="sidebar" aria-label="Main">
      <a class="brand" href="#/home">
        <span class="brand-mark" data-icon="bolt"></span>
        PulseFit
      </a>
      <div data-nav></div>
      <p class="sidebar-foot">Progress is saved in this browser.</p>
    </nav>

    <main class="main" id="main" tabindex="-1">
      <div class="page" id="view" aria-live="polite"></div>
    </main>
  </div>

  <nav class="tabbar" aria-label="Main" data-nav></nav>

  <div id="layer"></div>

  <noscript>
    <p style="padding:24px;color:#fff">PulseFit needs JavaScript enabled to run.</p>
  </noscript>

  <script src="data.js"></script>
  <script src="img/manifest.js"></script>
  <script src="app.js"></script>
</body>
</html>
