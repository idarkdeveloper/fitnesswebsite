<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mizan — your day in balance</title>
  <meta name="description" content="Your day in balance: workouts, meals, sleep, self-care and home routines in one daily plan. Free, in your browser." />
  <meta name="theme-color" content="#0e1116" />
  <!-- Only this site's own scripts may run; network calls only to this site and Supabase. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co https://world.openfoodfacts.org; frame-src https://www.youtube-nocookie.com; base-uri 'none'; form-action 'none'; object-src 'none'" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />

  <!-- Installable app (PWA) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Mizan" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- Apply saved theme before first paint -->
  <script src="theme-boot.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <!-- First launch: shown while the app's files load, removed by app.js after the first render. -->
  <div class="boot" id="boot" role="status" aria-label="Mizan is loading">
    <div class="boot-in">
      <svg class="boot-mark" viewBox="0 -14 280 242" width="200" height="173" fill="none" aria-hidden="true">
        <circle class="boot-head" cx="140" cy="16" r="14"/>
        <path class="boot-rail" d="M124 204C90 158 62 126 62 92C62 66 80 50 102 50C122 50 140 64 140 82C140 64 158 50 178 50C200 50 218 66 218 92C218 126 190 158 156 204"/>
        <path class="boot-heart" pathLength="1" d="M124 204C90 158 62 126 62 92C62 66 80 50 102 50C122 50 140 64 140 82C140 64 158 50 178 50C200 50 218 66 218 92C218 126 190 158 156 204"/>
        <g class="boot-lift">
          <path class="boot-rail" d="M8 120H110L124 94L140 128L156 94L170 120H272"/>
          <path class="boot-trace" pathLength="1" d="M8 120H110L124 94L140 128L156 94L170 120H272"/>
          <path class="boot-stop" d="M22 94V146M38 104V136M258 94V146M242 104V136"/>
        </g>
      </svg>
      <p class="boot-name">Mizan</p>
      <p class="boot-sub">Getting your day ready</p>
      <div class="boot-bar" aria-hidden="true"><span></span></div>
    </div>
    <noscript><p class="boot-sub">Mizan needs JavaScript enabled to run.</p></noscript>
  </div>
  <div class="backdrop" aria-hidden="true"></div>

  <div class="shell">
    <nav class="sidebar" aria-label="Main">
      <a class="brand" href="#/today">
        <img class="brand-mark" src="icons/icon.svg" alt="" width="34" height="34" />
        Mizan
      </a>
      <div data-nav></div>
      <p class="sidebar-foot">Saved on this device.</p>
    </nav>

    <main class="main" id="main" tabindex="-1">
      <div class="page" id="view"></div>
    </main>
  </div>

  <nav class="tabbar" aria-label="Main" data-nav></nav>

  <div id="layer"></div>

  <script src="data.js"></script>
  <script src="dumbbells.js"></script>
  <script src="img/manifest.js"></script>
  <script src="sync-config.js"></script>
  <script src="sync-core.js"></script>
  <script src="mealplan.js"></script>
  <script src="recipes.js"></script>
  <script src="care.js"></script>
  <script src="care-products.js"></script>
  <script src="prayer.js"></script>
  <script src="goalplan.js"></script>
  <script src="videos.js"></script>
  <script src="pwa.js"></script>
  <script src="app.js"></script>
  <script src="sync.js"></script>
</body>
</html>
