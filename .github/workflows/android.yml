name: Android app

# Builds the PulseFit Android app: a Capacitor shell that loads the live site and reads Health Connect
# (Samsung Health, Galaxy Watch). The site itself updates through GitHub Pages, so a new APK is only
# needed when the Android shell changes. On main the APK is published as the "android" release:
#   https://github.com/idarkdeveloper/fitnesswebsite/releases/latest/download/pulsefit.apk
#
# Signing: add two repository secrets to keep one key across builds, so updates install over the app:
#   ANDROID_KEYSTORE_BASE64  (base64 of a .jks/.keystore file whose key alias is "pulsefit")
#   ANDROID_KEYSTORE_PASSWORD
# Without them each build gets a throwaway key, and installing a newer build means uninstalling first
# (sign in again afterwards and your synced data comes back).
on:
  push:
    branches: [main]
    paths: ['android/**', 'www/**', 'package.json', 'capacitor.config.json', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'www/**', 'package.json', 'capacitor.config.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Sync web assets and plugins
        run: npx cap sync android

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/pulsefit.keystore"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            PASS="$KS_PASS"
            echo "Signing with the key from repository secrets."
          else
            PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$KS" -alias pulsefit -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=PulseFit, C=DE" > /dev/null
            echo "::notice::No signing secrets set, so this build uses a throwaway key. Uninstall the old app before installing it."
          fi
          echo "PF_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "PF_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PpfVersionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk ../pulsefit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pulsefit-apk
          path: pulsefit.apk

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android pulsefit.apk --latest \
            --title "PulseFit Android app (build ${{ github.run_number }})" \
            --notes "Open this page on your Android phone, download pulsefit.apk and open it to install. It reads Samsung Health and Galaxy Watch data through Health Connect. Built from ${{ github.sha }}."
